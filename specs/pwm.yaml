requirements:
  - id: P01
    text: If duty equals 0 then out equals 0
  - id: P02
    text: out and duty equals 0 are mutually exclusive
  - id: P03
    text: If out then duty is greater than 0
  - id: P04
    text: out must never exceed 1
  - id: P05
    text: always out is less than or equal to 1
  - id: P06
    text: If not duty equals 0 then out is greater than or equal to 0
